[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lambda-cold-start-bench"
version = "0.1.0"
description = "Measure AWS Lambda cold starts from REPORT log lines, or by forcing cold starts on a function you own."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.28"]
dev = ["pytest>=7", "boto3>=1.28"]

[project.scripts]
lambda-cold-start-bench = "lambda_cold_start_bench.cli:main"

[tool.setuptools]
packages = ["lambda_cold_start_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
